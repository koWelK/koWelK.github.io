<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OMSI 麓原交通协会">
    <meta name="keywords" content="地图下载，时刻表查询">
    <meta name="author" content="koWel_22">
    
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

    <title>地图下载 | [架空] 麓交协</title>

    <!-- ===== 引入外部 CSS ===== -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/grid_style.css">
    <link rel="stylesheet" href="css/fade.css">

</head>

<body>

 <!-- 导航栏 -->
    <div id="header-placeholder"></div>

    <!-- ===== 地图下载网格 ===== -->
    <div class="grid-container">
        <a href="product.html?project=omsi" class="grid-item item-left">
            <div class="overlay-text">
                OMSI 麓原
                <span>点击查看详情</span>
            </div>
        </a>
        <a href="product.html?project=bve" class="grid-item item-right-bottom">
            <div class="overlay-text">
                BVE 作品
                <span>点击查看详情</span>
            </div>
        </a>
    </div>

    <!-- 页脚 -->
    <div id="footer-placeholder"></div>

    <!-- ===== JS导入 ===== -->
    <script src="js/main.js"></script>
    
    <script>
        // 加载导航栏
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => document.getElementById('header-placeholder').innerHTML = data)
            .catch(err => console.log('Header加载失败'));

        // 加载页脚
        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data)
            .catch(err => console.log('Footer加载失败'));
    </script>
    <script src="js/cursor.js"></script>

</body>
</html>
