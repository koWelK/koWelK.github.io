<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OMSI 麓原交通协会" />
    <meta name="keywords" content="坡道纵曲线计算器" />
    <meta name="author" content="koWel_22" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <title>坡道纵曲线计算器 | [架空] 麓交协</title>

    <!-- ===== 引入外部 CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/Gradient.css" />
</head>
<body>

    <!-- ===== 导航栏占位 ===== -->
    <div id="header-placeholder"></div>

    <!-- ===== 主容器 ===== -->
    <div class="container" id="app">

        <!-- 标题 -->
        <div class="header">
            <h1>📐 坡道纵曲线计算器</h1>
            <span class="badge">平滑过渡版</span>
        </div>

        <!-- 输入区域 -->
        <div class="input-grid">
            <div class="input-group">
                <label>坡道总长度 <span class="unit">L (m)</span></label>
                <input type="number" id="inputLength" value="120" step="0.1" min="0.1" placeholder="例如 120" />
                <div class="hint">水平投影总长度</div>
            </div>
            <div class="input-group">
                <label>前后高度差 <span class="unit">H (m)</span></label>
                <input type="number" id="inputHeight" value="6.0" step="0.01" min="0" placeholder="例如 6.0" />
                <div class="hint">终点与起点的高程差</div>
            </div>
            <div class="input-group">
                <label>纵曲线长度 <span class="unit">l (m)</span></label>
                <input type="number" id="inputCurve" value="25" step="0.1" min="0" placeholder="例如 25" />
                <div class="hint">单个纵曲线长度（前后各一个）</div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-row">
            <button class="btn" id="calcBtn">计算</button>
            <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
        </div>

        <!-- 错误信息 -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- 结果区域 -->
        <div class="result-area" id="resultArea">
            <!-- 坡度摘要 -->
            <div class="summary-cards" id="summaryCards"></div>

            <!-- 数据表格 -->
            <div class="data-table-wrap">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th>区段</th>
                            <th>长度 (m)</th>
                            <th>高度变化 (m)</th>
                            <th>起点高程 (m)</th>
                            <th>终点高程 (m)</th>
                            <th>坡度</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- 图表 -->
            <div class="chart-wrap">
                <canvas id="chartCanvas" width="900" height="480"></canvas>
            </div>
            <div class="key-hint">⬤ 绿色：前纵曲线 &nbsp;｜&nbsp; ⬤ 蓝色：中间直线段 &nbsp;｜&nbsp; ⬤ 红色：后纵曲线</div>
        </div>

    </div>

    <!-- ===== 页脚占位 ===== -->
    <div id="footer-placeholder"></div>

    <!-- ===== JavaScript ===== -->
    <script src="js/Gradient.js"></script>

    <!-- 组件加载 -->
    <script>
        // 加载导航栏
        fetch('components/header.html')
            .then(response => {
                if (!response.ok) throw new Error('Header 加载失败');
                return response.text();
            })
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Header加载失败:', err));

        // 加载页脚
        fetch('components/footer.html')
            .then(response => {
                if (!response.ok) throw new Error('Footer 加载失败');
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Footer加载失败:', err));
    </script>

</body>
</html>
